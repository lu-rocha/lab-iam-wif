name: Teste OIDC GCP

on:
  push:
    branches:
      - main

jobs:
  teste-oidc:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Autenticar na GCP via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/246679122838/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "ci-runner@tbx-lucimara-silva.iam.gserviceaccount.com"

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Teste de autenticação
        run: |
          echo "Usuário autenticado:"
          gcloud auth list

          echo "Projetos:"
          gcloud projects list